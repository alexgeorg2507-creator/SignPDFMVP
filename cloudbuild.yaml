steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - gcloud
      - run
      - deploy
      - signfinder
      - --source=.
      - --region=europe-west1
      - --memory=2Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=1
      - --timeout=300
      - --allow-unauthenticated
      - --update-secrets=ACCESS_CODE=ACCESS_CODE:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest
      - --set-env-vars=GCS_BUCKET=signfinder-config
timeout: 1200s
options:
  logging: CLOUD_LOGGING_ONLY
