steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - gcloud
      - run
      - deploy
      - signfinder
      - --source=.
      - --region=europe-west1
      - --memory=2Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=1
      - --timeout=300
      - --allow-unauthenticated
      - --set-env-vars=ACCESS_CODE=$_ACCESS_CODE,ANTHROPIC_API_KEY=$_ANTHROPIC_API_KEY,GCS_BUCKET=signfinder-config
timeout: 1200s
options:
  logging: CLOUD_LOGGING_ONLY
